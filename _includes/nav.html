{% assign tabs = "Home|/,Research|/research/,Publications|/publications/,Experience|/experience/,About|/about/" | split: "," %}
<header class="nav-wrap">
  <nav class="nav container" aria-label="Main">
    <a class="logo" href="{{ '/' | relative_url }}" aria-label="Sneha Swaroopa, home"><span>Sneha Swaroopa<i>.</i></span><img class="logo-ucla" src="{{ '/assets/logos/ucla.png' | relative_url }}" alt="UCLA" width="40" height="18"></a>
    <div class="tabs" id="nav-links" role="list">
      {% for t in tabs %}{% assign p = t | split: "|" %}
      <a role="listitem" href="{{ p[1] | relative_url }}" {% if page.url == p[1] or page.url == p[1] | append: 'index.html' %}class="active" aria-current="page"{% endif %}>{{ p[0] }}</a>
      {% endfor %}
    </div>
    <div class="nav-actions">
      <button class="kbd-btn" data-open-palette aria-label="Open command menu"><span>Search</span><kbd>⌘K</kbd></button>
      <button class="icon-btn" data-theme-toggle aria-label="Toggle light and dark theme">
        <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <button class="icon-btn menu-btn" aria-label="Open menu" aria-expanded="false" aria-controls="nav-links">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </nav>
</header>
